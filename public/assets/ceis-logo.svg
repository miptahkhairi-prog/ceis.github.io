<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg{fill:#F8FAFC}
      .ring{fill:#0F4C81}
      .ringLight{fill:#0b3b63}
      .inner{fill:#cfeef5}
      .accent{fill:#F4B400}
      .secondary{fill:#00695C}
      .textMain{font-family: 'Poppins', sans-serif; font-weight:700; fill: #ffffff}
      .textSub{font-family: 'Inter', sans-serif; font-weight:600; fill: #ffffff}
    </style>
  </defs>
  <!-- Background circle -->
  <circle cx="512" cy="512" r="500" class="ring" />
  <!-- Inner white ring -->
  <circle cx="512" cy="512" r="420" fill="#ffffff" />
  <!-- Inner teal circle with abstract map-like shapes -->
  <circle cx="512" cy="512" r="360" class="inner" />
  <!-- Abstract map shapes (stylized) -->
  <g transform="translate(60,120) scale(0.9)">
    <path d="M300 200c40-30 120-40 180-20c60 20 120 80 130 130c10 50-40 120-80 140c-40 20-140 10-200-20c-60-30-120-110-130-160c-10-50 40-80 100-110z" fill="#69b7c9" opacity="0.95" />
    <path d="M200 340c30-20 80-30 130-10c50 20 90 60 100 90c10 30-20 70-50 80c-30 10-90 0-130-20c-40-20-70-60-60-90c10-30 30-50 10-50z" fill="#37a8bf" opacity="0.95" />
  </g>
  <!-- Accent semicircle around C -->
  <path d="M360 400 A180 180 0 0 1 520 320" stroke="#F4B400" stroke-width="18" fill="none" stroke-linecap="round" transform="translate(0,40)" />

  <!-- CEIS text -->
  <text x="512" y="540" text-anchor="middle" font-size="140" class="textMain" style="filter: drop-shadow(0 4px 6px rgba(0,0,0,0.25));">CEIS</text>

  <!-- Outer text on ring: CENTER OF EASTERN INDONESIAN STUDIES (top) and INDONESIA (bottom) -->
  <g transform="translate(512,512)">
    <text y="-420" text-anchor="middle" font-size="28" fill="#ffffff" font-family="Inter, sans-serif" letter-spacing="1.5">CENTER OF EASTERN INDONESIAN STUDIES</text>
    <text y="470" text-anchor="middle" font-size="32" fill="#ffffff" font-family="Inter, sans-serif" letter-spacing="2">INDONESIA</text>
  </g>

</svg>
